org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx2048m
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Compile Kotlin in the Gradle process instead of spawning a separate
# Kotlin daemon. Avoids "Could not connect to Kotlin compile daemon" on
# machines where the standalone daemon cannot start/connect.
kotlin.compiler.execution.strategy=in-process
